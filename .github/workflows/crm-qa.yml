name: CRM regression checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build:next
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          STORMFY_SCREENSHOT_LOGS: "1"
      # No production secrets, paid API calls, cache or artifact storage.
